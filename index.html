<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8" />
    <title>Kcgram | Login</title>
    <link rel="icon" href="title.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css" />
    <style>
        p {
            top: 50%;
            color: antiquewhite;
            font-size: 5em;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="center">

        <h1>KCGRAM Login</h1>
        <form method="post">
            <div class="txt_field">
                <input type="text" required />
                <span></span>
                <label>Username or Email address</label>
            </div>
            <div class="txt_field">
                <input type="password" required />
                <span></span>
                <label>Password</label>
            </div>
            <div class="pass">Forgot Password?</div>
            <input type="submit" value="Login" />
            <div class="signup_link">Not a member? <a href="signup.html">Signup</a></div>
        </form>
    </div>
</body>

</html>
