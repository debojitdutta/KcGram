<!DOCTYPE html>
<html lang="en">

<head>

    <title> login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 class="heading">Welcome to KcGram</h1>
        <h2 class="title"> SIGNUP AS </h2>
    </header>

    <!-- container div -->
    <div class="container">

        <!-- upper button section to select
			the login or signup form -->
        <div class="slider"></div>
        <div class="btn">
            <button class="login">Faculty</button>
            <button class="signup">Student</button>
        </div>

        <!-- Form section that contains the
			login and the signup form -->
        <div class="form-section">

            <!-- login form -->
            <div class="login-box">
                <input type="email" class="email ele" placeholder="username/email@email.com">
                <input type="name" class="email ele" placeholder="username">
                <input type="password" class="password ele" placeholder="password">
                <button class="clkbtn">Signup</button>
                <p>Already Registered?<a href="newkc.html">Login</a></p>

            </div>
            <div class="signup-box">
                <input type="text" class="name ele" placeholder="Enter your name">
                <input type="email" class="email ele" placeholder="youremail@email.com">
                <input type="password" class="password ele" placeholder="password">
                <input type="password" class="password ele" placeholder="Confirm password">
                <button class="clkbtn">Signup</button>
                <p>Already Registered?<a href="newkc.html">Login</a></p>

            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
