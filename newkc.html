<!DOCTYPE html>
<html lang="en">

<head>
    <title> login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1 class="heading">Welcome to KcGram</h1>
        <h2 class="title"> LOGIN AS </h2>
    </header>

    <!-- container div -->
    <div class="container">

        <!-- upper button section to select
			the login or signup form -->
        <div class="slider"></div>
        <div class="btn">
            <button class="login">Faculty</button>
            <button class="signup">Student</button>
        </div>

        <!-- Form section that contains the
			login and the signup form -->
        <div class="form-section">

            <!-- login form -->
            <div class="login-box">
                <input type="email" 
                class="email ele" 
                placeholder="username/email@email.com">
                <input type="name" class="email ele" placeholder="username">    
                <input type="password" 
                class="password ele" 
                placeholder="password">
                <button class="clkbtn">Login</button>
                <p>New registration?<a href="newregis.html">Signup</a></p>

            </div>
            <div class="signup-box">
                <input type="email" 
                class="email ele" 
                placeholder="youremail@email.com">
                <input type="name" class="email ele" placeholder="username">
                <input type="password" 
                class="password ele" 
                placeholder="password">
                <button class="clkbtn">Login</button>
                <p>New registration?<a href="newregis.html">Signup</a></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
