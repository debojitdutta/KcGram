<!DOCTYPE html>
<!-- Website - www.codingnepalweb.com -->
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Kcgram | Signup </title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Poppins:wght@400;500;600&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #800000;
      height: 100vh;
      text-align: center;
      text-decoration: solid;
    }

    p {
      top: 50%;
      color: antiquewhite;
      text-align: center;
      font-size: 5em;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 420px;
      width: 100%;
      background: rgb(255, 240, 240);
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
      border-color: solid white;
    }

    .center kcg {
      text-align: center;
      padding: 20px 0;

    }

    .center h1 {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px #800000;
    }

    .center form {
      padding: 0 40px;
      box-sizing: border-box;
    }

    form .txt_field {
      position: relative;
      border-bottom: 2px solid #adadad;
      margin: 30px 0;
    }

    .txt_field input {
      width: 100%;
      padding: 0 5px;
      height: 40px;
      font-size: 16px;
      border: none;
      background: none;
      outline: none;
    }

    .txt_field label {
      position: absolute;
      top: 50%;
      left: 5px;
      color: #adadad;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      transition: 0.5s;
    }

    .txt_field span::before {
      content: "";
      position: absolute;
      top: 40px;
      left: 0;
      width: 0%;
      height: 2px;
      background: #800000;
      transition: 0.5s;
    }

    .txt_field input:focus~label,
    .txt_field input:valid~label {
      top: -5px;
      color: #800000;
    }

    .txt_field input:focus~span::before,
    .txt_field input:valid~span::before {
      width: 100%;
    }

    input[type="submit"] {
      width: 100%;
      height: 50px;
      background: #800000;
      border-radius: 25px;
      font-size: 18px;
      color: #e9f4fb;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: 0.5s;
      border: none;
    }

    input[type="submit"]:hover {
      border-color: #800000;
    }

    .signup_link {
      margin: 30px 0;
      text-align: center;
      font-size: 16px;
      color: #666666;
    }

    .signup_link a {
      color: #800000;
      text-decoration: none;
    }

    .signup_link a:hover {
      text-decoration: underline;
    }
    
    .info {
      font-size: 15px;
      color: #666666;
    }
  </style>
</head>

<body>
  <p> </p>
  <div class="center">

    <h1 style="color: #800000;">KCGRAM Signup</h1>
    <form method="post">
      <div class="txt_field">
        <input type="text" required />
        <span></span>
        <label>Email address</label>
      </div>
      <div class="txt_field">
        <input type="text" required />
        <span></span>
        <label>Username</label>
      </div>

      <div class="txt_field">
        <input type="password" required />
        <span></span>
        <label>Create Password</label>
      </div>

      <input type="submit" value="Signup" />
      <div class="signup_link">Already a member? <a href="index.html">Login</a></div>
    </form>
    <hr>
    <p class="info">You get special access to the website</p>
    <a href="homepage1.html" target="_blank" rel="noopener noreferrer">CLICK HERE</a>
  </div>
</body>

</html>
